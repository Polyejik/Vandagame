<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#9ce1ec"><link rel="manifest" href="./manifest.webmanifest"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Ванда — полёт за мечтой</title><style>:root{--ink:#315764;--teal:#3a9ca1;--coral:#e96b57}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#9ce1ec;color:var(--ink)}body{min-height:100svh;overflow:hidden}.sky{position:fixed;inset:0;background:linear-gradient(180deg,#82d3df 0%,#c6eee6 56%,#e7efbe 100%);overflow:hidden}.sun{position:absolute;width:280px;height:280px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,186,.95),rgba(255,229,125,.24) 42%,rgba(255,229,125,0) 70%)}.cloud{position:absolute;background:rgba(255,255,250,.78);border-radius:999px;filter:drop-shadow(0 8px 12px rgba(58,115,126,.10))}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:48%;height:120%;left:8%;bottom:20%}.cloud:after{width:40%;height:108%;right:12%;bottom:36%}.c1{width:120px;height:36px;left:-20px;top:12%}.c2{width:92px;height:28px;right:16px;top:27%;opacity:.75}.c3{width:74px;height:23px;left:15%;top:43%;opacity:.56}.hill{position:absolute;left:-12%;right:-12%;border-radius:50% 50% 0 0/100% 100% 0 0}.h1{height:220px;bottom:70px;background:linear-gradient(#9cc89a,#79b884)}.h2{height:180px;bottom:18px;background:linear-gradient(#7fb783,#62a56b)}.grass{position:absolute;left:0;right:0;bottom:0;height:76px;background:linear-gradient(#77b95f,#4e914f)}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 12%,rgba(255,248,214,.24),rgba(255,248,214,0) 34%),linear-gradient(180deg,rgba(74,148,160,.08),rgba(28,61,77,.18));backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px)}.card{width:min(92vw,446px);padding:18px 22px 22px;border-radius:34px;text-align:center;background:linear-gradient(165deg,rgba(255,253,245,.98),rgba(255,245,218,.96));box-shadow:0 24px 80px rgba(34,68,80,.28),inset 0 1px 0 #fff;border:2px solid rgba(255,255,255,.78);position:relative;overflow:hidden}.menu-hero{position:relative;height:176px;margin:0 0 16px;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#9ce1ec 0%,#def6eb 56%,#f8e39f 100%);border:1px solid rgba(73,140,148,.12);box-shadow:0 12px 24px rgba(78,137,145,.14)}.menu-hero img{position:absolute;width:122px;height:auto;left:50%;bottom:16px;transform:translateX(-50%) rotate(-4deg);filter:drop-shadow(0 18px 20px rgba(52,92,99,.22));z-index:4}.brand h1{font:900 clamp(48px,13vw,67px)/.88 Georgia,serif;letter-spacing:.03em;margin:0;color:#ea745e;text-shadow:0 3px 0 rgba(255,214,162,.8)}.brand p{margin:8px 0 0;font-size:13px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#3a9ca1}.intro{font-size:15px;line-height:1.45;margin:15px auto 18px;max-width:336px}.how{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}.hint{padding:12px 7px 11px;background:rgba(255,255,255,.72);border:1px solid rgba(54,133,139,.15);border-radius:18px;font-size:12px;font-weight:750}.hint b{display:block;font-size:25px;line-height:1;margin-bottom:7px;color:#e96b57}.play{width:100%;border:0;border-radius:18px;padding:17px 18px;color:#fff;background:linear-gradient(180deg,#f79573,#df594c);box-shadow:0 7px 0 #af493d,0 14px 28px rgba(190,75,62,.28);font:900 17px/1 system-ui,sans-serif;letter-spacing:.08em}.small{margin:14px 0 0;font-size:11px;opacity:.7}@media(max-height:720px){.card{transform:scale(.88)}}</style></head><body><div class="sky" aria-hidden="true"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="hill h1"></div><div class="hill h2"></div><div class="grass"></div></div><main class="overlay"><section class="card"><div class="menu-hero"><img id="heroArt" alt="Ванда и её фокстерьер на воздушном шаре"></div><div class="brand"><h1>ВАНДА</h1><p>полёт за мечтой</p></div><p class="intro">Отправляйся в уютное путешествие над лесами: собирай косточки, пополняй топливо и мягко обходи тучи.</p><div class="how"><div class="hint"><b>↑</b>Держи экран<br>чтобы подниматься</div><div class="hint"><b>↓</b>Отпусти<br>чтобы планировать вниз</div></div><button class="play" id="play" type="button">ПОЛЕТЕЛИ!</button><p class="small">Web/PWA · Android собирается из этой же версии</p></section></main><script>fetch('../assets/menuhero.b64').then(r=>r.text()).then(s=>{document.getElementById('heroArt').src='data:image/webp;base64,'+s.trim()}).catch(()=>{});if('serviceWorker'in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}document.getElementById('play').addEventListener('click',()=>alert('Полная игровая сборка переносится в web/assets. Android-пайплайн уже подключён.'));</script></body></html>
