<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#78cfd8" />
  <title>Ванда — полёт за мечтой</title>
  <style>
    :root{--sky:#79cfd8;--cream:#fff7df;--coral:#ef6f5d;--teal:#3d7f88;--ink:#234451}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:linear-gradient(#79cfd8 0%,#bce8df 56%,#e9efc0 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    body{min-height:100svh;display:grid;place-items:center;overflow:hidden}
    .scene{position:relative;width:min(100%,760px);height:100svh;min-height:620px;display:flex;align-items:center;justify-content:center;padding:32px 20px 48px;isolation:isolate}
    .sun{position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,178,.92),rgba(255,244,178,0) 70%);right:-55px;top:30px;z-index:-3}
    .cloud{position:absolute;width:190px;height:55px;background:rgba(255,255,255,.58);border-radius:999px;filter:blur(.2px);z-index:-2}
    .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:75px;height:75px;left:33px;top:-34px}.cloud:after{width:96px;height:96px;right:26px;top:-48px}
    .c1{left:-45px;top:15%}.c2{right:-80px;top:40%;transform:scale(.72);opacity:.65}
    .ground{position:absolute;left:-10%;right:-10%;bottom:-80px;height:260px;background:radial-gradient(ellipse at 50% 0%,#9ec36d 0 38%,#77a75f 39% 100%);border-radius:50% 50% 0 0/25% 25% 0 0;z-index:-1}
    .card{width:min(100%,520px);padding:34px 28px 30px;text-align:center;background:rgba(255,250,232,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.7);border-radius:30px;box-shadow:0 24px 70px rgba(32,77,85,.19)}
    .balloon{width:118px;height:142px;margin:0 auto 14px;position:relative}.envelope{position:absolute;left:19px;top:0;width:80px;height:98px;border-radius:48% 48% 44% 44%/55% 55% 45% 45%;background:repeating-linear-gradient(90deg,#ef7160 0 16px,#f9e3b8 16px 32px,#4b98a1 32px 48px);box-shadow:inset -9px -9px 18px rgba(44,86,92,.15)}
    .rope{position:absolute;top:92px;width:2px;height:30px;background:#8d6c4c}.r1{left:43px;transform:rotate(-8deg)}.r2{right:43px;transform:rotate(8deg)}.basket{position:absolute;left:39px;bottom:2px;width:40px;height:27px;background:linear-gradient(#bb8650,#8e5d36);border-radius:4px 4px 10px 10px;box-shadow:inset 0 5px rgba(255,255,255,.18)}
    h1{font-family:Georgia,serif;margin:4px 0 5px;color:var(--coral);font-size:clamp(40px,10vw,65px);line-height:.9;letter-spacing:.02em} .sub{font-weight:800;letter-spacing:.24em;font-size:12px;color:var(--teal);margin-bottom:24px}
    .status{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;background:rgba(61,127,136,.10);font-size:13px;font-weight:800;color:var(--teal)} .dot{width:9px;height:9px;border-radius:50%;background:#f0b947;box-shadow:0 0 0 5px rgba(240,185,71,.13)}
    p{margin:18px auto 0;max-width:380px;font-size:15px;line-height:1.55;color:#47636b} .small{margin-top:13px;font-size:12px;opacity:.72}
    @media(max-width:430px){.card{padding:28px 20px 26px;border-radius:26px}.balloon{transform:scale(.9);margin-bottom:6px}}
  </style>
</head>
<body>
  <main class="scene">
    <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="ground"></div>
    <section class="card" aria-label="Ванда — полёт за мечтой">
      <div class="balloon" aria-hidden="true"><div class="envelope"></div><div class="rope r1"></div><div class="rope r2"></div><div class="basket"></div></div>
      <h1>ВАНДА</h1>
      <div class="sub">ПОЛЁТ ЗА МЕЧТОЙ</div>
      <div class="status"><span class="dot"></span> Игра готовится к полёту</div>
      <p>Мы переносим Ванду в полноценную web-версию и готовим Android-приложение. Скоро здесь можно будет играть прямо в браузере.</p>
      <div class="small">Web • PWA • Android / Google Play</div>
    </section>
  </main>
</body>
</html>
