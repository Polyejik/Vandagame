name: Import current Vanda game
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-current-game.yml']
permissions:
  contents: write
jobs:
  import-game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download current v36 game
        run: |
          curl -L --fail --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0c14-81f4-a9ed-16f39183a996/raw?se=2026-09-17T05%3A34%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=34653fff-7869-5c6b-8d68-d39383567839&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T04%3A18%3A08Z&ske=2026-09-18T04%3A18%3A08Z&sks=b&skv=2026-02-06&sig=7JjJUUAVS5KAObIondIblTT%2BqNdCR8UpAoKC7uLdp0c%3D' -o /tmp/vanda.html
          test $(wc -c < /tmp/vanda.html) -gt 8000000
      - name: Make v36 the canonical Web/PWA game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/vanda.html')
          s=p.read_text(encoding='utf-8')
          if 'manifest.webmanifest' not in s:
              s=s.replace('</head>', '  <link rel="manifest" href="./manifest.webmanifest">\n</head>', 1)
          if 'serviceWorker.register' not in s:
              s=s.replace('</body>', '''<script>\nif ('serviceWorker' in navigator && location.protocol !== 'file:') {\n  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));\n}\n</script>\n</body>''', 1)
          Path('web/index.html').write_text(s, encoding='utf-8')
          PY
          cat > web/sw.js <<'EOF'
          const CACHE='vandagame-v36-20260917';
          const CORE=['./manifest.webmanifest'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)));self.skipWaiting()});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;if(e.request.mode==='navigate'){e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./index.html'))));return;}e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{const c=resp.clone();caches.open(CACHE).then(cache=>cache.put(e.request,c));return resp})))});
          EOF
      - name: Commit game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/sw.js
          git commit -m 'Deploy current Vanda v36 game to Web/PWA'
          git push
